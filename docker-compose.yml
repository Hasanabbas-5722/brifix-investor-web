version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brifix-investor-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # You can pass additional env variables here
      # - NEXT_PUBLIC_API_URL=https://api.example.com
    restart: unless-stopped
    # If you want to use the .env file in the same directory:
    # env_file:
    #   - .env
